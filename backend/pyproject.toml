[project]
name = "kms"
version = "0.1.0"
description = "Knowledge Management System: upload text and images, find them by keyword and meaning."
authors = [{ name = "Michael Saar", email = "saarmichael@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "sqlalchemy>=2",
    "psycopg[binary]>=3",
    "alembic",
    "pgvector",
    "pydantic>=2",
    "pydantic-settings",
    "pillow",
    "google-genai",
    "voyageai",
    "tenacity",
    "httpx",
    "pysbd>=0.3.4,<0.4",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
kms = "kms.cli:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
# The migrations folder is also named "alembic"; without this, ruff takes the package for our own code.
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs real vendor API keys"]

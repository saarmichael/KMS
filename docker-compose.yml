services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: kms
      POSTGRES_PASSWORD: kms
      POSTGRES_DB: kms
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kms -d kms"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The production container, for a local check before deploying. Not started by default:
  #   docker compose --profile full up --build
  api:
    build: .
    profiles: ["full"]
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://kms:kms@db:5432/kms
      BLOB_DIR: /data/blobs
      AI_PROVIDER: ${AI_PROVIDER:-fake}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      SEED_ON_START: ${SEED_ON_START:-false}
    volumes:
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
